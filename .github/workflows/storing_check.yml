name: 24/7 Efteling Storing Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # Dwing de runner om alle stappen in de root van je opslagruimte uit te voeren
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Code ophalen uit repository
        uses: actions/checkout@v4

      - name: Node.js omgeving instellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Voer checker.js uit
        run: node checker.js

