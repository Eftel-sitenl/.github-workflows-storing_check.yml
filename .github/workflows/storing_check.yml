name: Storing Check

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen uit repository
        uses: actions/checkout@v4

      - name: Node.js omgeving instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # De 'npm install' stap is hier volledig verwijderd

      - name: Voer checker.js uit
        run: node checker.js
