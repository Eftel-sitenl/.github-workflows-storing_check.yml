name: Storing Check

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Zorgt ervoor dat je de workflow handmatig kunt starten

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen uit repository
        uses: actions/checkout@v4

      - name: Node.js omgeving instellen
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Geüpdatet naar 24 om de waarschuwingen op te lossen
          # De regel "cache: 'npm'" is verwijderd om de lock-file fout (exit code 254) te voorkomen

      - name: Install dependencies
        run: npm install

      - name: Voer checker.js uit
        run: node checker.js
